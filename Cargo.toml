[package]
name = "pb-inpx-dl"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[features]
default = []
device = ["dep:inkview", "dep:inkview-slint", "dep:slint", "dep:slint-build", "dep:image", "dep:fontique"]

[[bin]]
name = "pb-inpx-dl"
path = "src/main.rs"
required-features = ["device"]

[dependencies]
anyhow = "1"
base64 = "0.22.1"
roxmltree = "0.21.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls", "cookies"] }
url = "2"
fontique = { version = "0.10", default-features = false, features = ["fontconfig-dlopen"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
inkview = { git = "https://github.com/simmsb/inkview-rs", rev = "15cdb984048bd878a780d3133e9f4fc64bb9edb0", default-features = false, features = ["sdk-6-10"], optional = true }
inkview-slint = { git = "https://github.com/simmsb/inkview-rs", rev = "15cdb984048bd878a780d3133e9f4fc64bb9edb0", default-features = false, features = ["sdk-6-10"], optional = true }
slint = { version = "=1.17.1", default-features = false, features = ["compat-1-2", "std", "renderer-software", "unstable-fontique-010"], optional = true }

[build-dependencies]
slint-build = { version = "=1.17.1", optional = true }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"
